<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finanzas · Personal + Negocio</title>
<meta name="theme-color" content="#2563eb">
<meta name="description" content="Gestión financiera personal y de negocio, con sincronización en la nube.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --card2:#eef1f5;
    --border:#dfe3ea;
    --text:#1a1d27;
    --muted:#667085;
    --blue:#2563eb;
    --green:#16a34a;
    --red:#dc2626;
    --yellow:#ca8a04;
    --accent:#2563eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  /* Layout */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:220px;background:var(--card);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;
  }
  .brand{padding:18px 18px 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-size:15px}
  .nav{flex:1;padding:10px 8px;overflow:auto}
  .nav button{
    width:100%;text-align:left;background:none;border:none;color:var(--muted);
    padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:11px;margin-bottom:2px;
  }
  .nav button:hover{background:var(--card2);color:var(--text)}
  .nav button.active{background:var(--accent);color:#fff;font-weight:600}
  .nav .ico{width:20px;text-align:center;font-size:16px}
  .sb-foot{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .topbar h1{font-size:18px;font-weight:700}
  .month-picker{display:flex;align-items:center;gap:6px;margin-left:auto}
  .content{padding:22px;max-width:1400px;width:100%}
  /* Controls */
  input,select,textarea,button{font-family:inherit;font-size:14px}
  input,select,textarea{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:8px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:60px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;width:auto;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:var(--card2);border:1px solid var(--border);color:var(--text)}
  .btn.green{background:var(--green)}
  .btn.red{background:var(--red)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn-icon{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:6px;width:auto;font-size:14px}
  .btn-icon:hover{background:var(--card2);color:var(--text)}
  .btn-icon.danger:hover{color:var(--red)}
  /* Cards & grid */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .section-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .stat .lbl{font-size:12px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .stat .val{font-size:24px;font-weight:700;letter-spacing:-.5px}
  .stat .sub{font-size:11px;color:var(--muted);margin-top:4px}
  .pos{color:var(--green)}
  .neg{color:var(--red)}
  .warn{color:var(--yellow)}
  .muted{color:var(--muted)}
  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  tbody tr:hover{background:var(--card2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .table-wrap{overflow-x:auto}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.ing{background:rgba(34,197,94,.15);color:var(--green)}
  .pill.egr{background:rgba(239,68,68,.15);color:var(--red)}
  .pill.per{background:rgba(59,130,246,.15);color:var(--blue)}
  .pill.neg2{background:rgba(234,179,8,.15);color:var(--yellow)}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-weight:700;font-size:14px}
  .badge.win{background:rgba(34,197,94,.15);color:var(--green)}
  .badge.loss{background:rgba(239,68,68,.15);color:var(--red)}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:13px}
  .legend .row{display:flex;align-items:center;gap:8px}
  .legend .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend .row .pc{color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:34px 20px}
  .empty .big{font-size:40px;margin-bottom:10px;opacity:.6}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
  .modal h3{margin-bottom:16px;font-size:16px}
  .field{margin-bottom:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  /* group cards */
  .group-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .group-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .group-head .nm{font-weight:700;font-size:14px;flex:1}
  .sub-list{margin-top:8px;padding-left:26px;display:flex;flex-direction:column;gap:5px}
  .sub-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .sub-item .sn{flex:1}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
  .toolbar .fld{min-width:130px}
  canvas{max-width:100%}
  .chart-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .expand-row{cursor:pointer}
  .expand-row .caret{display:inline-block;width:14px;transition:transform .15s;color:var(--muted)}
  .expand-row.open .caret{transform:rotate(90deg)}
  .sub-rows td{background:var(--bg);font-size:12px}
  .hint{font-size:11px;color:var(--muted);margin-top:5px}
  .alert{padding:11px 14px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .alert.warn{background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.3);color:var(--yellow)}
  .alert.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--green)}
  .flex{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .mt{margin-top:16px}
  .mb{margin-bottom:16px}
  .right{text-align:right}
  .nowrap{white-space:nowrap}
  .hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;width:auto}
  @media(max-width:900px){
    .sidebar{position:fixed;z-index:60;transform:translateX(-100%);transition:transform .2s}
    .sidebar.open{transform:translateX(0)}
    .hamburger{display:block}
    .g4{grid-template-columns:repeat(2,1fr)}
    .g3,.g2{grid-template-columns:1fr}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
    .backdrop.open{display:block}
  }
  @media(max-width:560px){
    .g4{grid-template-columns:1fr}
    .content{padding:16px}
    .row2{grid-template-columns:1fr}
    .topbar h1{font-size:16px}
    .month-picker #globalMonth{width:130px}
    .btn{padding:11px 15px}
    input,select,textarea{padding:11px 12px}
  }
  /* App instalada (PWA): respetar notch/barras del sistema */
  @supports(padding:max(0px)){
    .topbar{padding-top:max(14px,env(safe-area-inset-top))}
    .sidebar{padding-top:env(safe-area-inset-top)}
    .content{padding-bottom:max(22px,env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">💰</span> Finanzas</div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="ico">📊</span> Dashboard</button>
      <button data-view="movimientos"><span class="ico">📝</span> Movimientos</button>
      <button data-view="grupos"><span class="ico">🗂️</span> Grupos</button>
      <button data-view="datos"><span class="ico">💾</span> Datos</button>
    </nav>
    <div class="sb-foot">
      <div id="syncBadge" style="font-weight:600;margin-bottom:4px">☁️ Sin sincronizar</div>
      Se guarda en este dispositivo.<br>Activá la nube en <b>Datos</b> para sincronizar.
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1 id="viewTitle">Dashboard</h1>
      <div class="month-picker">
        <button class="btn-icon" id="prevMonth" title="Mes anterior">◀</button>
        <input type="month" id="globalMonth" style="width:160px">
        <button class="btn-icon" id="nextMonth" title="Mes siguiente">▶</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Modal generic -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";
/* ============================================================
   Estado & persistencia
   ============================================================ */
const STORAGE_KEY = "finanzas_app_data";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

const DEFAULT_COLORS = ["#3b82f6","#22c55e","#ef4444","#eab308","#a855f7","#06b6d4","#f97316","#ec4899","#14b8a6","#8b5cf6","#f43f5e","#84cc16"];

function defaultData(){
  const mk = (nombre,tipo,color,icono,subs)=>({
    id:uid(),nombre,tipo,color,icono,
    subgrupos:(subs||[]).map(s=>({id:uid(),nombre:s,notas:""}))
  });
  return {
    grupos:[
      mk("Alimentación","Personal","#22c55e","🍎",["Supermercado","Restaurantes","Otros"]),
      mk("Servicios del hogar","Personal","#3b82f6","🏠",["Luz","Agua","Gas","Internet","Alquiler"]),
      mk("Salud","Personal","#ef4444","⚕️",["Medicamentos","Consultas","Obra social"]),
      mk("Transporte","Personal","#f97316","🚗",["Combustible","Transporte público","Mantenimiento"]),
      mk("Entretenimiento","Personal","#a855f7","🎮",["Streaming","Salidas","Hobbies"]),
      mk("Educación","Personal","#06b6d4","📚",["Cursos","Materiales"]),
      mk("Otros personal","Personal","#8a91a3","📌",["Varios"]),
      mk("Ingresos ventas","Negocio","#22c55e","💵",["Ventas mostrador","Ventas online","Servicios"]),
      mk("Mercadería / compras","Negocio","#eab308","🛒",["Compra mercadería","Insumos","Proveedores"]),
      mk("Personal/sueldos","Negocio","#ef4444","👥",["Sueldos","Cargas sociales","Aguinaldo"]),
      mk("Servicios negocio","Negocio","#3b82f6","🔌",["Luz","Alquiler local","Internet"]),
      mk("Marketing","Negocio","#ec4899","📣",["Publicidad","Redes","Diseño"]),
      mk("Gastos operativos","Negocio","#f97316","⚙️",["Impuestos","Comisiones","Mantenimiento"]),
      mk("Otros negocio","Negocio","#8a91a3","📎",["Varios"])
    ],
    movimientos:[],
    configuracion:{ moneda:"ARS", simbolo:"$" },
    updatedAt:0
  };
}

let data = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const d = JSON.parse(raw);
    if(!d.grupos) d.grupos=[];
    if(!d.movimientos) d.movimientos=[];
    if(!d.configuracion) d.configuracion={moneda:"ARS",simbolo:"$"};
    if(typeof d.updatedAt!=="number") d.updatedAt=0;
    delete d.stock; // versión anterior con inventario: ya no se usa
    delete d.configuracion.umbralStock;
    return d;
  }catch(e){
    console.error("Error cargando datos",e);
    return defaultData();
  }
}
// save(): guarda en localStorage. Por defecto marca el cambio con timestamp
// y dispara la sincronización a la nube. Pasar {remote:true} al adoptar datos
// bajados de la nube para no re-marcar ni volver a subirlos.
function save(opts){
  opts=opts||{};
  if(!opts.remote) data.updatedAt=Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ alert("No se pudo guardar: "+e.message); }
  if(!opts.remote) scheduleSyncPush();
}

/* ============================================================
   Sincronización en la nube (GitHub Gist privado)
   El token y el id del gist se guardan aparte, en localStorage,
   nunca dentro de los datos ni del backup.
   ============================================================ */
const SYNC_KEY="finanzas_sync";
const GIST_FILE="finanzas_data.json";
let syncCfg=loadSync();
let syncState="idle"; // idle | syncing | ok | error | off
let syncMsg="";
let pushTimer=null;

function loadSync(){
  try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||{}; }
  catch(e){ return {}; }
}
function saveSync(){ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }
function syncEnabled(){ return !!(syncCfg.token && syncCfg.gistId && syncCfg.auto!==false); }

async function gistRequest(method, path, body){
  const res=await fetch("https://api.github.com/gists"+path,{
    method,
    headers:{
      "Authorization":"Bearer "+syncCfg.token,
      "Accept":"application/vnd.github+json",
      "Content-Type":"application/json"
    },
    body: body?JSON.stringify(body):undefined
  });
  if(!res.ok){
    let detail="";
    try{ detail=(await res.json()).message||""; }catch(e){}
    throw new Error("GitHub "+res.status+(detail?(" · "+detail):""));
  }
  return res.json();
}

// Crea el gist privado la primera vez (o si se perdió el id).
async function syncConnect(token, gistId){
  syncCfg.token=token.trim();
  syncCfg.gistId=(gistId||"").trim();
  syncCfg.auto=true;
  setSyncState("syncing","Conectando…");
  try{
    if(syncCfg.gistId){
      // validar acceso bajando el contenido
      const remote=await gistPull();
      if(remote){ // hay datos remotos: adoptarlos si son más nuevos o si local está vacío
        adoptRemote(remote);
      }else{
        await gistPush(); // gist existe pero sin nuestro archivo: subir local
      }
    }else{
      const g=await gistRequest("POST","",{
        description:"Datos de la app Finanzas (privado)",
        public:false,
        files:{[GIST_FILE]:{content:JSON.stringify(data)}}
      });
      syncCfg.gistId=g.id;
    }
    saveSync();
    setSyncState("ok","Sincronizado");
    return true;
  }catch(e){
    setSyncState("error",e.message);
    return false;
  }
}
function syncDisconnect(){
  syncCfg={};
  saveSync();
  setSyncState("off","Sin sincronización");
  if(currentView==="datos") render();
}

async function gistPull(){
  const g=await gistRequest("GET","/"+syncCfg.gistId);
  const f=g.files&&g.files[GIST_FILE];
  if(!f) return null;
  let content=f.content;
  if(f.truncated && f.raw_url){ content=await (await fetch(f.raw_url)).text(); }
  try{ return JSON.parse(content); }catch(e){ return null; }
}
async function gistPush(){
  await gistRequest("PATCH","/"+syncCfg.gistId,{
    files:{[GIST_FILE]:{content:JSON.stringify(data)}}
  });
  syncCfg.lastSync=Date.now();
  saveSync();
}
// Adopta datos remotos si son más nuevos que los locales.
function adoptRemote(remote){
  if(remote && typeof remote==="object" && remote.grupos && remote.movimientos){
    if((remote.updatedAt||0) > (data.updatedAt||0)){
      data=remote;
      save({remote:true});
      if(document.getElementById("content")) render();
      return true;
    }
  }
  return false;
}

// Sincronización completa: baja, resuelve por timestamp, y sube si local es más nuevo.
async function syncNow(){
  if(!syncCfg.token||!syncCfg.gistId){ setSyncState("off","Sin sincronización"); return; }
  setSyncState("syncing","Sincronizando…");
  try{
    const remote=await gistPull();
    const adopted=remote?adoptRemote(remote):false;
    if(!adopted && (!remote || (data.updatedAt||0) >= (remote.updatedAt||0))){
      await gistPush();
    }
    setSyncState("ok","Sincronizado");
  }catch(e){
    setSyncState("error",e.message);
  }
}
// Push automático (con debounce) tras cada cambio local.
function scheduleSyncPush(){
  if(!syncEnabled()) return;
  setSyncState("syncing","Guardando en la nube…");
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{
    try{ await gistPush(); setSyncState("ok","Sincronizado"); }
    catch(e){ setSyncState("error",e.message); }
  },1500);
}
function setSyncState(st,msg){
  syncState=st; syncMsg=msg||"";
  updateSyncBadge();
  const el=document.getElementById("syncStatusLine");
  if(el) el.innerHTML=syncStatusHTML();
}
function syncBadgeText(){
  if(!syncCfg.token) return "☁️ Sin sincronizar";
  return {idle:"☁️ Nube",syncing:"🔄 Sincronizando…",ok:"✅ Sincronizado",error:"⚠️ Error de sync",off:"☁️ Sin sincronizar"}[syncState]||"☁️ Nube";
}
function updateSyncBadge(){
  const b=document.getElementById("syncBadge");
  if(b) b.textContent=syncBadgeText();
}
function syncStatusHTML(){
  if(!syncCfg.token) return '<span class="muted">No configurada. Conectá tu GitHub para sincronizar entre dispositivos.</span>';
  const last=syncCfg.lastSync?("Última: "+new Date(syncCfg.lastSync).toLocaleString("es-AR")):"";
  const color=syncState==="error"?"var(--red)":syncState==="ok"?"var(--green)":"var(--muted)";
  return `<span style="color:${color}">${esc(syncBadgeText())}${syncMsg?(" · "+esc(syncMsg)):""}</span> <span class="muted">${esc(last)}</span>`;
}

/* ============================================================
   Utilidades
   ============================================================ */
function fmt(n){
  const s = data.configuracion.simbolo || "$";
  const val = Number(n||0);
  return s + " " + val.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtNum(n){
  return Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function pct(n){
  if(n===Infinity) return "∞";
  return (n>=0?"+":"") + Number(n||0).toFixed(1) + "%";
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function currentMonth(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function monthLabel(ym){
  if(!ym) return "";
  const [y,m] = ym.split("-").map(Number);
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return meses[m-1] + " " + y;
}
function monthLabelLong(ym){
  if(!ym) return "";
  const [y,m] = ym.split("-").map(Number);
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m-1] + " " + y;
}
function shiftMonth(ym,delta){
  let [y,m] = ym.split("-").map(Number);
  m += delta;
  while(m<1){m+=12;y--;}
  while(m>12){m-=12;y++;}
  return y+"-"+String(m).padStart(2,"0");
}
function grupoById(id){ return data.grupos.find(g=>g.id===id); }
function subById(g,id){ return g && g.subgrupos.find(s=>s.id===id); }

/* Cálculos de resumen para un mes */
function calcMonth(ym){
  const movs = data.movimientos.filter(m=>m.mes===ym);
  const r = {
    personal:{ing:0,egr:0}, negocio:{ing:0,egr:0},
    porGrupo:{} // id -> {ing,egr,tipo}
  };
  movs.forEach(m=>{
    const g = grupoById(m.grupoId);
    const tipo = g ? g.tipo : "Personal";
    const monto = Number(m.monto||0);
    if(!r.porGrupo[m.grupoId]) r.porGrupo[m.grupoId]={ing:0,egr:0,tipo};
    if(m.tipo==="Ingreso"){ r.porGrupo[m.grupoId].ing+=monto; r[tipo==="Negocio"?"negocio":"personal"].ing+=monto; }
    else { r.porGrupo[m.grupoId].egr+=monto; r[tipo==="Negocio"?"negocio":"personal"].egr+=monto; }
  });
  r.personalBalance = r.personal.ing - r.personal.egr;
  // negocio: resultado neto = ingresos - egresos
  r.negocioNeto = r.negocio.ing - r.negocio.egr;
  r.totalIngresos = r.personal.ing + r.negocio.ing;
  r.totalEgresos = r.personal.egr + r.negocio.egr;
  r.balanceGlobal = r.totalIngresos - r.totalEgresos;
  return r;
}

/* ============================================================
   Canvas helpers: torta, barras, líneas
   ============================================================ */
function drawPie(canvas, items, opts){
  opts = opts||{};
  const dpr = window.devicePixelRatio||1;
  const size = opts.size||200;
  canvas.width = size*dpr; canvas.height=size*dpr;
  canvas.style.width=size+"px"; canvas.style.height=size+"px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,size,size);
  const cx=size/2, cy=size/2, r=size/2-4, ir=opts.donut? r*0.58 : 0;
  const total = items.reduce((a,b)=>a+b.value,0);
  if(total<=0){
    ctx.fillStyle="#e2e5ea";
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    if(ir){ctx.arc(cx,cy,ir,0,Math.PI*2,true);}
    ctx.fill();
    ctx.fillStyle="#667085";ctx.font="12px sans-serif";ctx.textAlign="center";
    ctx.fillText("Sin datos",cx,cy);
    return;
  }
  let start=-Math.PI/2;
  items.forEach(it=>{
    if(it.value<=0) return;
    const ang = it.value/total*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+ang);
    ctx.closePath();
    ctx.fillStyle=it.color;
    ctx.fill();
    start+=ang;
  });
  if(ir){
    ctx.globalCompositeOperation="destination-out";
    ctx.beginPath();ctx.arc(cx,cy,ir,0,Math.PI*2);ctx.fill();
    ctx.globalCompositeOperation="source-over";
    if(opts.centerText){
      ctx.fillStyle="#1a1d27";ctx.font="bold 15px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(opts.centerText,cx,cy-7);
      if(opts.centerSub){ctx.fillStyle="#667085";ctx.font="11px sans-serif";ctx.fillText(opts.centerSub,cx,cy+11);}
    }
  }
}

function drawBars(canvas, groups, series, opts){
  // groups: labels[]; series: [{name,color,values[]}]
  opts=opts||{};
  const dpr=window.devicePixelRatio||1;
  const W=opts.width||canvas.clientWidth||600, H=opts.height||260;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width="100%";canvas.style.height=H+"px";
  const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const padL=54,padR=14,padT=14,padB=40;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  let max=0;
  groups.forEach((_,i)=>series.forEach(s=>{max=Math.max(max,Math.abs(s.values[i]||0));}));
  if(max<=0) max=1;
  const nice = niceMax(max);
  // grid
  ctx.strokeStyle="#e2e5ea";ctx.fillStyle="#667085";ctx.font="10px sans-serif";ctx.lineWidth=1;
  const lines=4;
  for(let i=0;i<=lines;i++){
    const y=padT+plotH-(plotH*i/lines);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.textAlign="right";ctx.textBaseline="middle";
    ctx.fillText(shortNum(nice*i/lines),padL-6,y);
  }
  const gCount=groups.length;
  const gw = plotW/gCount;
  const sCount=series.length;
  const bw = Math.min(38, gw/(sCount+0.6));
  groups.forEach((label,gi)=>{
    const gx=padL+gi*gw;
    series.forEach((s,si)=>{
      const v=s.values[gi]||0;
      const h=Math.abs(v)/nice*plotH;
      const bx=gx+(gw-bw*sCount)/2+si*bw;
      const by=padT+plotH-h;
      ctx.fillStyle=v<0?"#ef4444":s.color;
      ctx.fillRect(bx,by,bw-3,h);
    });
    ctx.fillStyle="#667085";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.textBaseline="top";
    const lbl = label.length>9?label.slice(0,8)+"…":label;
    ctx.fillText(lbl,gx+gw/2,padT+plotH+6);
  });
}

function drawLines(canvas, labels, series, opts){
  opts=opts||{};
  const dpr=window.devicePixelRatio||1;
  const W=opts.width||canvas.clientWidth||600, H=opts.height||280;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width="100%";canvas.style.height=H+"px";
  const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const padL=56,padR=14,padT=14,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  let max=0,min=0;
  series.forEach(s=>s.values.forEach(v=>{max=Math.max(max,v);min=Math.min(min,v);}));
  if(max===0&&min===0){max=1;}
  const niceH=niceMax(Math.max(Math.abs(max),1));
  const niceL=min<0?-niceMax(Math.abs(min)):0;
  const range=niceH-niceL || 1;
  const yOf=v=>padT+plotH-((v-niceL)/range*plotH);
  // grid
  ctx.strokeStyle="#e2e5ea";ctx.fillStyle="#667085";ctx.font="10px sans-serif";ctx.lineWidth=1;
  const lines=4;
  for(let i=0;i<=lines;i++){
    const val=niceL+(range*i/lines);
    const y=yOf(val);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText(shortNum(val),padL-6,y);
  }
  // zero line
  if(niceL<0){
    const zy=yOf(0);ctx.strokeStyle="#9aa1ae";ctx.beginPath();ctx.moveTo(padL,zy);ctx.lineTo(W-padR,zy);ctx.stroke();
  }
  const n=labels.length;
  const xOf=i=>padL+(n<=1?plotW/2:plotW*i/(n-1));
  series.forEach(s=>{
    ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
    s.values.forEach((v,i)=>{i===0?ctx.moveTo(xOf(i),yOf(v)):ctx.lineTo(xOf(i),yOf(v));});
    ctx.stroke();
    ctx.fillStyle=s.color;
    s.values.forEach((v,i)=>{ctx.beginPath();ctx.arc(xOf(i),yOf(v),2.5,0,Math.PI*2);ctx.fill();});
  });
  ctx.fillStyle="#8a91a3";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.textBaseline="top";
  labels.forEach((l,i)=>{
    if(n>12 && i%2!==0) return;
    ctx.fillText(l,xOf(i),padT+plotH+6);
  });
}
function niceMax(v){
  if(v<=0) return 1;
  const mag=Math.pow(10,Math.floor(Math.log10(v)));
  const norm=v/mag;
  let nice;
  if(norm<=1)nice=1;else if(norm<=2)nice=2;else if(norm<=5)nice=5;else nice=10;
  return nice*mag;
}
function shortNum(v){
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(a>=1e3) return (v/1e3).toFixed(1).replace(/\.0$/,"")+"k";
  return String(Math.round(v));
}

    cols.appendChild(col);
    const host=col.querySelector("#col-"+tipo);

    gs.forEach(g=>{
      const card=document.createElement("div");
      card.className="group-card";
      card.innerHTML=`

      g.subgrupos.forEach(s=>{
        const row=document.createElement("div");
        row.className="sub-item";
        row.innerHTML=`<span>•</span><span class="sn">${esc(s.nombre)}${s.notas?` <span class="muted">— ${esc(s.notas)}</span>`:""}</span>
          <button class="btn-icon" data-edits="${g.id}|${s.id}" title="Editar">✏️</button>
          <button class="btn-icon danger" data-dels="${g.id}|${s.id}" title="Eliminar">🗑️</button>`;
        sl.appendChild(row);
      });
    });
  });

  box.querySelector("#addGrupo").onclick=()=>openGrupoModal();
  box.querySelectorAll("[data-editg]").forEach(b=>b.onclick=()=>openGrupoModal(b.dataset.editg));
  box.querySelectorAll("[data-delg]").forEach(b=>b.onclick=()=>{
    const g=grupoById(b.dataset.delg);
    const used=data.movimientos.filter(m=>m.grupoId===g.id).length;
    if(confirm(`¿Eliminar el grupo "${g.nombre}"?`+(used?`\n\nHay ${used} movimiento(s) asociados que quedarán sin grupo.`:""))){
      data.grupos=data.grupos.filter(x=>x.id!==g.id);
      save();renderGrupos(c);
    }
  });
  box.querySelectorAll("[data-addsub]").forEach(b=>b.onclick=()=>openSubModal(b.dataset.addsub));
  box.querySelectorAll("[data-edits]").forEach(b=>b.onclick=()=>{const[gid,sid]=b.dataset.edits.split("|");openSubModal(gid,sid);});
  box.querySelectorAll("[data-dels]").forEach(b=>b.onclick=()=>{
    const[gid,sid]=b.dataset.dels.split("|");
    const g=grupoById(gid);
    if(confirm("¿Eliminar subgrupo?")){
      g.subgrupos=g.subgrupos.filter(s=>s.id!==sid);
      save();renderGrupos(c);
    }
  });
}
function openGrupoModal(id){
  const editing=id?grupoById(id):null;
  const g=editing||{nombre:"",tipo:"Personal",color:DEFAULT_COLORS[data.grupos.length%DEFAULT_COLORS.length],icono:""};
  openModal(`
    <h3>${editing?"Editar":"Nuevo"} grupo</h3>
    <div class="field"><label>Nombre</label><input id="gNombre" value="${esc(g.nombre)}" placeholder="Ej: Alimentación"></div>
    <div class="row2">
      <div class="field"><label>Tipo</label><select id="gTipo"><option ${g.tipo==="Personal"?"selected":""}>Personal</option><option ${g.tipo==="Negocio"?"selected":""}>Negocio</option></select></div>
      <div class="field"><label>Icono (emoji)</label><input id="gIcono" value="${esc(g.icono||"")}" placeholder="🍎" maxlength="4"></div>
    </div>
    <div class="field"><label>Color</label>
      <div class="flex wrap" id="colorPick" style="gap:8px">
        ${DEFAULT_COLORS.map(col=>`<span class="dot pick" data-col="${col}" style="width:26px;height:26px;background:${col};cursor:pointer;border:2px solid ${col===g.color?'#fff':'transparent'}"></span>`).join("")}
        <input type="color" id="gColor" value="${g.color}" style="width:44px;height:32px;padding:2px">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn green" id="saveGrupo">Guardar</button>
    </div>
  `);
  const colorInput=document.getElementById("gColor");
  document.querySelectorAll("#colorPick .pick").forEach(p=>p.onclick=()=>{
    colorInput.value=p.dataset.col;
    document.querySelectorAll("#colorPick .pick").forEach(x=>x.style.border="2px solid transparent");
    p.style.border="2px solid #fff";
  });
  document.getElementById("saveGrupo").onclick=()=>{
    const nombre=document.getElementById("gNombre").value.trim();
    if(!nombre){alert("Poné un nombre.");return;}
    const rec={nombre,tipo:document.getElementById("gTipo").value,color:colorInput.value,icono:document.getElementById("gIcono").value.trim()};
    if(editing){Object.assign(editing,rec);}
    else data.grupos.push({id:uid(),...rec,subgrupos:[]});
    save();closeModal();render();
  };
}
function openSubModal(gid,sid){
  const g=grupoById(gid);
  const editing=sid?subById(g,sid):null;
  const s=editing||{nombre:"",notas:""};
  openModal(`
    <h3>${editing?"Editar":"Nuevo"} subgrupo <span class="muted" style="font-weight:400;font-size:13px">· ${esc(g.nombre)}</span></h3>
    <div class="field"><label>Nombre</label><input id="sNombre" value="${esc(s.nombre)}" placeholder="Ej: Supermercado"></div>
    <div class="field"><label>Descripción / notas</label><textarea id="sNotas" placeholder="Opcional">${esc(s.notas||"")}</textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn green" id="saveSub">Guardar</button>
    </div>
  `);
  document.getElementById("saveSub").onclick=()=>{
    const nombre=document.getElementById("sNombre").value.trim();
    if(!nombre){alert("Poné un nombre.");return;}
    const notas=document.getElementById("sNotas").value.trim();
    if(editing){editing.nombre=nombre;editing.notas=notas;}
    else g.subgrupos.push({id:uid(),nombre,notas});
    save();closeModal();renderGrupos(document.getElementById("content"));

/* ============================================================
   Vista: Resúmenes (integrado en Dashboard? -> agregamos tabla expandible aquí en Movimientos? )
   Añadimos un resumen expandible dentro de comparación... Mejor: sección propia dentro dashboard.
   Requisito 5: Resúmenes mensuales -> lo mostramos como parte del Dashboard extra?
   Lo ponemos como tabla expandible en la vista "Movimientos" bajo un botón, o mejor una subvista.
   Implementamos aquí una función reutilizable de tabla expandible y la insertamos en Comparar?
   Para cumplir, agregamos la tabla expandible al final del Dashboard.
   ============================================================ */
function buildExpandableSummary(ym){
  const r=calcMonth(ym);
  const wrap=document.createElement("div");
  wrap.className="card mt";
  wrap.innerHTML=`<div class="section-title">🧾 Detalle por grupo → subgrupo (${monthLabelLong(ym)})</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Grupo</th><th>Tipo</th><th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Balance</th></tr></thead>
      <tbody id="sumBody"></tbody>
    </table></div>`;
  const body=wrap.querySelector("#sumBody");
  const groupsWithData=data.grupos.filter(g=>r.porGrupo[g.id]);
  if(!groupsWithData.length){
    body.innerHTML=`<tr><td colspan="5"><div class="empty">Sin movimientos este mes.</div></td></tr>`;
    return wrap;
  }
  const rows=[];
  groupsWithData.forEach(g=>{
    const gg=r.porGrupo[g.id];
    const bal=gg.ing-gg.egr;
    rows.push(`<tr class="expand-row" data-g="${g.id}">
      <td><span class="caret">▶</span> ${esc((g.icono||"")+" "+g.nombre)}</td>
      <td><span class="pill ${g.tipo==='Negocio'?'neg2':'per'}">${g.tipo}</span></td>
      <td class="num pos">${fmt(gg.ing)}</td>
      <td class="num neg">${fmt(gg.egr)}</td>
      <td class="num ${bal>=0?'pos':'neg'}">${fmt(bal)}</td>
    </tr>`);
    // subgrupos: sumar movimientos por subgrupo
    const movs=data.movimientos.filter(m=>m.mes===ym && m.grupoId===g.id);
    const bySub={};
    movs.forEach(m=>{
      const key=m.subgrupoId||"_none";
      if(!bySub[key])bySub[key]={ing:0,egr:0};
      bySub[key][m.tipo==="Ingreso"?"ing":"egr"]+=Number(m.monto||0);
    });
    Object.keys(bySub).forEach(sk=>{
      const s=subById(g,sk);
      const nm=s?s.nombre:"(sin subgrupo)";
      const d=bySub[sk];
      rows.push(`<tr class="sub-rows" data-parent="${g.id}" style="display:none">
        <td style="padding-left:34px">↳ ${esc(nm)}</td><td></td>
        <td class="num">${d.ing>0?fmt(d.ing):'—'}</td>
        <td class="num">${d.egr>0?fmt(d.egr):'—'}</td>
        <td class="num">${fmt(d.ing-d.egr)}</td>
      </tr>`);
    });
  });
  body.innerHTML=rows.join("");
  body.querySelectorAll(".expand-row").forEach(row=>row.onclick=()=>{
    row.classList.toggle("open");
    const open=row.classList.contains("open");
    body.querySelectorAll(`.sub-rows[data-parent="${row.dataset.g}"]`).forEach(sr=>sr.style.display=open?"":"none");
  });
  return wrap;
}

let cmpA=shiftMonth(currentMonth(),-1), cmpB=currentMonth();
function renderComparar(c){
  const box=document.createElement("div");
  box.innerHTML=`
    <div class="card mb">
      <div class="toolbar" style="margin:0">
        <div class="fld"><label>Mes A</label><input type="month" id="cmpA" value="${cmpA}"></div>
        <div class="fld"><label>Mes B</label><input type="month" id="cmpB" value="${cmpB}"></div>
      </div>
    </div>
    <div id="cmpOut"></div>`;
  c.appendChild(box);
  box.querySelector("#cmpA").onchange=e=>{cmpA=e.target.value;drawCompare();};
  box.querySelector("#cmpB").onchange=e=>{cmpB=e.target.value;drawCompare();};
  drawCompare();
}
function drawCompare(){
  const out=document.getElementById("cmpOut");
  if(!out) return;
  const rA=calcMonth(cmpA), rB=calcMonth(cmpB);
  // categorias: por grupo (egresos+ingresos net?) usamos egresos para gastos y también globales
  const cats=[
    {nm:"Ingresos personales",a:rA.personal.ing,b:rB.personal.ing},
    {nm:"Egresos personales",a:rA.personal.egr,b:rB.personal.egr},
    {nm:"Ingresos negocio",a:rA.negocio.ing,b:rB.negocio.ing},
    {nm:"Egresos negocio",a:rA.negocio.egr,b:rB.negocio.egr},
    {nm:"Resultado negocio",a:rA.negocioNeto,b:rB.negocioNeto},
    {nm:"Balance global",a:rA.balanceGlobal,b:rB.balanceGlobal}
  ];
  const rows=cats.map(ct=>{
    const diff=ct.b-ct.a;
    const p=ct.a!==0?(diff/Math.abs(ct.a)*100):(ct.b!==0?Infinity:0);
    const up=diff>0;
    return `<tr>
      <td>${esc(ct.nm)}</td>
      <td class="num">${fmt(ct.a)}</td>
      <td class="num">${fmt(ct.b)}</td>
      <td class="num ${diff===0?'muted':up?'pos':'neg'}">${diff>0?'+':''}${fmt(diff)}</td>
      <td class="num ${diff===0?'muted':up?'pos':'neg'}">${diff===0?'—':(up?'▲ ':'▼ ')+pct(p)}</td>
    </tr>`;
  }).join("");

  // barras por grupo (egresos)
  const groupIds=[...new Set([...Object.keys(rA.porGrupo),...Object.keys(rB.porGrupo)])];
  const labels=[], valA=[], valB=[];
  groupIds.forEach(id=>{
    const g=grupoById(id); if(!g) return;
    labels.push(g.nombre);
    valA.push((rA.porGrupo[id]?rA.porGrupo[id].egr:0));
    valB.push((rB.porGrupo[id]?rB.porGrupo[id].egr:0));
  });

  out.innerHTML=`
    <div class="card mb">
      <div class="section-title">⚖️ ${monthLabel(cmpA)} vs ${monthLabel(cmpB)}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Categoría</th><th class="num">${monthLabel(cmpA)}</th><th class="num">${monthLabel(cmpB)}</th><th class="num">Diferencia</th><th class="num">% Cambio</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="section-title">📊 Egresos por grupo</div>
      <div class="legend" style="flex-direction:row;gap:18px;margin-bottom:10px">
        <div class="row"><span class="dot" style="background:#3b82f6"></span> ${monthLabel(cmpA)}</div>
        <div class="row"><span class="dot" style="background:#22c55e"></span> ${monthLabel(cmpB)}</div>
      </div>
      <canvas id="cmpBars"></canvas>
      ${labels.length?"":'<div class="empty">Sin datos para graficar.</div>'}
    </div>`;
  if(labels.length){
    drawBars(document.getElementById("cmpBars"),labels,[
      {name:"A",color:"#3b82f6",values:valA},
      {name:"B",color:"#22c55e",values:valB}
    ],{height:280});
  }
}

let selectedYear=new Date().getFullYear();
function renderAnual(c){
  const years=availableYears();
  const box=document.createElement("div");
  box.innerHTML=`
    <div class="card mb">
      <div class="toolbar" style="margin:0">
        <div class="fld"><label>Año</label><select id="yearSel">${years.map(y=>`<option ${y==selectedYear?"selected":""}>${y}</option>`).join("")}</select></div>
      </div>
    </div>
    <div id="anualOut"></div>`;
  c.appendChild(box);
  box.querySelector("#yearSel").onchange=e=>{selectedYear=Number(e.target.value);drawAnual();};
  drawAnual();
}
function availableYears(){
  const set=new Set();
  data.movimientos.forEach(m=>{if(m.mes)set.add(m.mes.slice(0,4));});
  set.add(String(new Date().getFullYear()));
  return [...set].sort();
}
function drawAnual(){
  const out=document.getElementById("anualOut");
  if(!out) return;
  const y=selectedYear;
  const meses=[];
  for(let i=1;i<=12;i++) meses.push(y+"-"+String(i).padStart(2,"0"));
  const rows=meses.map(ym=>calcMonth(ym));
  const mesNombres=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

  // tabla mes x categorias principales
  let totPersEgr=0,totNegNeto=0,totGlobal=0,totIng=0;
  const tblRows=meses.map((ym,i)=>{
    const r=rows[i];
    totPersEgr+=r.personal.egr; totNegNeto+=r.negocioNeto; totGlobal+=r.balanceGlobal; totIng+=r.totalIngresos;
    const hasData=r.totalIngresos>0||r.totalEgresos>0;
    return `<tr>
      <td>${mesNombres[i]}</td>
      <td class="num">${hasData?fmt(r.totalIngresos):'<span class="muted">—</span>'}</td>
      <td class="num">${hasData?fmt(r.personal.egr):'<span class="muted">—</span>'}</td>
      <td class="num ${r.negocioNeto>=0?'pos':'neg'}">${hasData?fmt(r.negocioNeto):'<span class="muted">—</span>'}</td>
      <td class="num ${r.balanceGlobal>=0?'pos':'neg'}">${hasData?fmt(r.balanceGlobal):'<span class="muted">—</span>'}</td>
    </tr>`;
  }).join("");

  // mejor y peor mes (solo con datos)
  let best=null,worst=null;
  meses.forEach((ym,i)=>{
    const r=rows[i];
    if(r.totalIngresos===0 && r.totalEgresos===0) return;
    if(best===null||r.balanceGlobal>rows[best].balanceGlobal) best=i;
    if(worst===null||r.balanceGlobal<rows[worst].balanceGlobal) worst=i;
  });
  const activeMonths=meses.filter((ym,i)=>rows[i].totalIngresos>0||rows[i].totalEgresos>0).length;

  out.innerHTML=`
    <div class="grid g4 mb">
      <div class="stat"><div class="lbl">💰 Ingresos anuales</div><div class="val pos">${fmt(totIng)}</div></div>
      <div class="stat"><div class="lbl">⚖️ Resultado anual</div><div class="val ${totGlobal>=0?'pos':'neg'}">${fmt(totGlobal)}</div></div>
      <div class="stat"><div class="lbl">📅 Promedio mensual</div><div class="val ${totGlobal>=0?'pos':'neg'}">${fmt(activeMonths?totGlobal/activeMonths:0)}</div><div class="sub">${activeMonths} mes(es) con datos</div></div>
      <div class="stat"><div class="lbl">🏢 Neto negocio anual</div><div class="val ${totNegNeto>=0?'pos':'neg'}">${fmt(totNegNeto)}</div></div>
    </div>
    <div class="grid g2 mb">
      <div class="stat"><div class="lbl">🏆 Mejor mes</div><div class="val pos">${best!==null?mesNombres[best]:'—'}</div><div class="sub">${best!==null?fmt(rows[best].balanceGlobal):'Sin datos'}</div></div>
      <div class="stat"><div class="lbl">📉 Peor mes</div><div class="val neg">${worst!==null?mesNombres[worst]:'—'}</div><div class="sub">${worst!==null?fmt(rows[worst].balanceGlobal):'Sin datos'}</div></div>
    </div>
    <div class="card mb">
      <div class="section-title">📈 Evolución mensual ${y}</div>
      <div class="legend" style="flex-direction:row;gap:18px;margin-bottom:10px;flex-wrap:wrap">
        <div class="row"><span class="dot" style="background:#3b82f6"></span> Global</div>
        <div class="row"><span class="dot" style="background:#22c55e"></span> Personal (balance)</div>
        <div class="row"><span class="dot" style="background:#eab308"></span> Negocio (neto)</div>
      </div>
      <canvas id="anualLines"></canvas>
    </div>
    <div class="card">
      <div class="section-title">🗓️ Detalle mes a mes</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Mes</th><th class="num">Ingresos</th><th class="num">Egresos pers.</th><th class="num">Neto negocio</th><th class="num">Balance global</th></tr></thead>
        <tbody>${tblRows}</tbody>
        <tfoot><tr style="font-weight:700">
          <td>Total ${y}</td><td class="num">${fmt(totIng)}</td><td class="num">${fmt(totPersEgr)}</td>
          <td class="num ${totNegNeto>=0?'pos':'neg'}">${fmt(totNegNeto)}</td>
          <td class="num ${totGlobal>=0?'pos':'neg'}">${fmt(totGlobal)}</td>
        </tr></tfoot>
      </table></div>
    </div>`;

  drawLines(document.getElementById("anualLines"),mesNombres,[
    {name:"Global",color:"#3b82f6",values:rows.map(r=>r.balanceGlobal)},
    {name:"Personal",color:"#22c55e",values:rows.map(r=>r.personalBalance)},
    {name:"Negocio",color:"#eab308",values:rows.map(r=>r.negocioNeto)}
  ],{height:280});
}

      <button class="btn green" id="saveCfg">Guardar configuración</button>
    </div>
    <div class="card mt">
      <div class="section-title" style="color:var(--red)">⚠️ Zona peligrosa</div>
      <button class="btn red" id="resetAll">Borrar todos los datos</button>
    </div>`;
  c.appendChild(box);

  box.querySelector("#expExcel").onclick=openExcelModal;
  box.querySelector("#expMonth").onclick=()=>exportCSV(selectedMonth);
  box.querySelector("#expAll").onclick=()=>exportCSV(null);

  // Sincronización
  const connectBtn=box.querySelector("#syncConnectBtn");
  if(connectBtn) connectBtn.onclick=async()=>{
    const token=box.querySelector("#syncToken").value;
    if(!token.trim()){alert("Pegá tu token de GitHub.");return;}
    connectBtn.disabled=true; connectBtn.textContent="Conectando…";
    const ok=await syncConnect(token, box.querySelector("#syncGistId").value);
    connectBtn.disabled=false;
    if(ok){ alert("¡Sincronización activada! Guardá este Gist ID para tu otro dispositivo:\n\n"+syncCfg.gistId); render(); }
    else { connectBtn.textContent="🔗 Conectar y sincronizar"; alert("No se pudo conectar. Revisá el token/permiso. Detalle: "+syncMsg); }
  };
  const nowBtn=box.querySelector("#syncNowBtn");
  if(nowBtn) nowBtn.onclick=async()=>{ nowBtn.disabled=true; await syncNow(); nowBtn.disabled=false; };
  const discBtn=box.querySelector("#syncDisc");
  if(discBtn) discBtn.onclick=()=>{ if(confirm("¿Desconectar la sincronización en este dispositivo? Los datos locales quedan intactos.")) syncDisconnect(); };
  const autoChk=box.querySelector("#syncAuto");
  if(autoChk) autoChk.onchange=()=>{ syncCfg.auto=autoChk.checked; saveSync(); updateSyncBadge(); };
  const copyId=box.querySelector("#syncCopyId");
  if(copyId) copyId.onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(syncCfg.gistId||""); copyId.textContent="✅ Copiado"; setTimeout(()=>copyId.textContent="📋 Copiar ID del gist",1500); };
  box.querySelector("#backup").onclick=doBackup;
  box.querySelector("#restoreFile").onchange=doRestore;
  box.querySelector("#saveCfg").onclick=()=>{
    data.configuracion.moneda=box.querySelector("#cfgMoneda").value.trim()||"ARS";
    data.configuracion.simbolo=box.querySelector("#cfgSimbolo").value.trim()||"$";
    save();render();
  };
  box.querySelector("#resetAll").onclick=()=>{
    if(confirm("¿Borrar TODOS los datos y volver a los valores por defecto? Esto no se puede deshacer.")){
      data=defaultData();save();setView("dashboard");
    }
  };
}
function csvCell(v){
  const s=String(v==null?"":v);
  return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function exportCSV(ym){
  const movs=(ym?data.movimientos.filter(m=>m.mes===ym):data.movimientos.slice())
    .sort((a,b)=>(a.mes<b.mes?-1:a.mes>b.mes?1:(a.fecha<b.fecha?-1:1)));
  const header=["Mes","Fecha","Tipo","TipoGrupo","Grupo","Subgrupo","Concepto","Detalle","Monto"];
  const lines=[header.join(";")];
  movs.forEach(m=>{
    const g=grupoById(m.grupoId);const s=subById(g,m.subgrupoId);
    lines.push([m.mes,m.fecha,m.tipo,g?g.tipo:"",g?g.nombre:"",s?s.nombre:"",m.concepto,m.detalle,fmtNum(m.monto)].map(csvCell).join(";"));
  });
  downloadFile((ym?("movimientos_"+ym):"movimientos_historial")+".csv",lines.join("\n"),"text/csv;charset=utf-8");
}
function doBackup(){
  downloadFile("finanzas_backup_"+currentMonth()+".json",JSON.stringify(data,null,2),"application/json");
}
function doRestore(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d.grupos||!d.movimientos) throw new Error("Formato inválido");
      if(!confirm("Esto reemplazará todos tus datos actuales. ¿Continuar?")) return;
      data=d;
      if(!data.configuracion)data.configuracion={moneda:"ARS",simbolo:"$"};
      delete data.stock;
      save();setView("dashboard");
      alert("Backup restaurado correctamente.");
    }catch(err){alert("No se pudo leer el archivo: "+err.message);}
  };
  reader.readAsText(file);
}
function downloadFile(name,content,type){
  downloadBlob(name,new Blob([content],{type}));
}
function downloadBlob(name,blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ============================================================
   Exportación a Excel (.xlsx nativo, sin librerías)
   Un .xlsx es un ZIP de archivos XML. Generamos el ZIP a mano
   (método STORE, sin compresión) con CRC32 propio.
   ============================================================ */
function crc32(bytes){
  let crc=~0;
  for(let i=0;i<bytes.length;i++){
    crc^=bytes[i];
    for(let j=0;j<8;j++) crc=(crc>>>1)^(0xEDB88320 & -(crc&1));
  }
  return (~crc)>>>0;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function zipStore(files){
  const u16=n=>[n&0xFF,(n>>>8)&0xFF];
  const u32=n=>[n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF];
  const chunks=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name=strBytes(f.name), body=f.bytes, crc=crc32(body);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(body.length),u32(body.length),u16(name.length),u16(0));
    const la=new Uint8Array(local.length+name.length+body.length);
    la.set(local,0); la.set(name,local.length); la.set(body,local.length+name.length);
    chunks.push(la);
    const cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(body.length),u32(body.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    const ca=new Uint8Array(cen.length+name.length);
    ca.set(cen,0); ca.set(name,cen.length);
    central.push(ca);
    offset+=la.length;
  });
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),
    u16(files.length),u16(files.length),u32(cenSize),u32(offset),u16(0)));
  return new Blob([...chunks,...central,eocd],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function colName(i){ let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s; }
function exportXLSX(movs,label){
  const headers=["Mes","Fecha","Tipo","Ámbito","Grupo","Subgrupo","Concepto","Detalle","Ingreso","Egreso"];
  const cell=(col,row,val,style,isNum)=>{
    const ref=colName(col)+row, s=style?` s="${style}"`:"";
    return isNum ? `<c r="${ref}"${s}><v>${val}</v></c>`
                 : `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${esc(val)}</t></is></c>`;
  };
  const rows=[];
  let hc=""; headers.forEach((h,i)=>hc+=cell(i,1,h,1,false));
  rows.push(`<row r="1">${hc}</row>`);
  let totIng=0,totEgr=0;
  movs.forEach((m,idx)=>{
    const r=idx+2, g=grupoById(m.grupoId), sub=subById(g,m.subgrupoId);
    const ing=m.tipo==="Ingreso"?Number(m.monto||0):null;
    const egr=m.tipo==="Egreso"?Number(m.monto||0):null;
    if(ing!=null)totIng+=ing; if(egr!=null)totEgr+=egr;
    let cc="";
    cc+=cell(0,r,m.mes||"",0,false);
    cc+=cell(1,r,m.fecha||"",0,false);
    cc+=cell(2,r,m.tipo||"",0,false);
    cc+=cell(3,r,g?g.tipo:"",0,false);
    cc+=cell(4,r,g?g.nombre:"",0,false);
    cc+=cell(5,r,sub?sub.nombre:"",0,false);
    cc+=cell(6,r,m.concepto||"",0,false);
    cc+=cell(7,r,m.detalle||"",0,false);
    if(ing!=null) cc+=cell(8,r,ing,2,true);
    if(egr!=null) cc+=cell(9,r,egr,2,true);
    rows.push(`<row r="${r}">${cc}</row>`);
  });
  const tr=movs.length+2;
  let tc=cell(7,tr,"TOTALES",4,false)+cell(8,tr,totIng,3,true)+cell(9,tr,totEgr,3,true);
  rows.push(`<row r="${tr}">${tc}</row>`);
  const lastData=Math.max(1,movs.length+1);
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="10"/><col min="2" max="2" width="12"/><col min="3" max="3" width="9"/><col min="4" max="4" width="11"/><col min="5" max="5" width="22"/><col min="6" max="6" width="18"/><col min="7" max="7" width="28"/><col min="8" max="8" width="26"/><col min="9" max="9" width="15"/><col min="10" max="10" width="15"/></cols><sheetData>${rows.join("")}</sheetData><autoFilter ref="A1:J${lastData}"/></worksheet>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const workbook=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Movimientos" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;$&quot;#,##0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const files=[
    {name:"[Content_Types].xml",bytes:strBytes(contentTypes)},
    {name:"_rels/.rels",bytes:strBytes(rels)},
    {name:"xl/workbook.xml",bytes:strBytes(workbook)},
    {name:"xl/_rels/workbook.xml.rels",bytes:strBytes(wbRels)},
    {name:"xl/styles.xml",bytes:strBytes(styles)},
    {name:"xl/worksheets/sheet1.xml",bytes:strBytes(sheet)}
  ];
  downloadBlob("movimientos_"+label+".xlsx", zipStore(files));
}
function openExcelModal(){
  openModal(`
    <h3>📊 Descargar a Excel</h3>
    <div class="field"><label>¿Qué período querés bajar?</label>
      <select id="xMode"><option value="mes">Un mes</option><option value="rango">Rango de meses</option><option value="todo">Todo el historial</option></select>
    </div>
    <div id="xMesWrap" class="field"><label>Mes</label><input type="month" id="xMes" value="${selectedMonth}"></div>
    <div id="xRangoWrap" class="row2" style="display:none">
      <div class="field"><label>Desde</label><input type="month" id="xDesde" value="${selectedMonth}"></div>
      <div class="field"><label>Hasta</label><input type="month" id="xHasta" value="${selectedMonth}"></div>
    </div>
    <p class="hint">Genera un archivo .xlsx con una fila por movimiento (Ingreso/Egreso en columnas separadas) y una fila de totales.</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn green" id="xGo">Descargar Excel</button>
    </div>`);
  const mode=document.getElementById("xMode");
  const upd=()=>{
    document.getElementById("xMesWrap").style.display=mode.value==="mes"?"":"none";
    document.getElementById("xRangoWrap").style.display=mode.value==="rango"?"":"none";
  };
  mode.onchange=upd; upd();
  document.getElementById("xGo").onclick=()=>{
    const all=data.movimientos.slice().sort((a,b)=>(a.mes<b.mes?-1:a.mes>b.mes?1:(a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0)));
    let movs,label;
    if(mode.value==="mes"){
      const ym=document.getElementById("xMes").value; if(!ym){alert("Elegí un mes.");return;}
      movs=all.filter(m=>m.mes===ym); label=ym;
    }else if(mode.value==="rango"){
      const d=document.getElementById("xDesde").value,h=document.getElementById("xHasta").value;
      if(!d||!h){alert("Completá desde y hasta.");return;}
      const lo=d<=h?d:h, hi=d<=h?h:d;
      movs=all.filter(m=>m.mes>=lo&&m.mes<=hi); label=lo+"_a_"+hi;
    }else{ movs=all; label="historial"; }
    if(!movs.length){alert("No hay movimientos en ese período.");return;}
    exportXLSX(movs,label); closeModal();
  };
}

  document.getElementById("modal").innerHTML="";

/* Dashboard: evolución anual (gráfico + cuadro) y detalle del mes al final */
function buildAnnualSection(ym){
  const year=ym.slice(0,4);
  const mesNombres=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const meses=[]; for(let i=1;i<=12;i++) meses.push(year+"-"+String(i).padStart(2,"0"));
  const rows=meses.map(m=>calcMonth(m));
  let tIng=0,tEgr=0;
  rows.forEach(r=>{tIng+=r.totalIngresos;tEgr+=r.totalEgresos;});
  const tbody=meses.map((m,i)=>{
    const r=rows[i], has=r.totalIngresos>0||r.totalEgresos>0, sel=(m===ym);
    return `<tr${sel?' style="background:var(--card2);font-weight:600"':''}>
      <td>${mesNombres[i]}${sel?' 📍':''}</td>
      <td class="num pos">${has?fmt(r.totalIngresos):'<span class="muted">—</span>'}</td>
      <td class="num neg">${has?fmt(r.totalEgresos):'<span class="muted">—</span>'}</td>
      <td class="num ${r.balanceGlobal>=0?'pos':'neg'}">${has?fmt(r.balanceGlobal):'<span class="muted">—</span>'}</td>
    </tr>`;
  }).join("");
  const card=document.createElement("div");
  card.className="card mt";
  card.innerHTML=`
    <div class="section-title">📈 Evolución anual ${esc(year)} · Ingresos vs Egresos</div>
    <div class="legend" style="flex-direction:row;gap:18px;margin-bottom:10px;flex-wrap:wrap">
      <div class="row"><span class="dot" style="background:#16a34a"></span> Ingresos</div>
      <div class="row"><span class="dot" style="background:#dc2626"></span> Egresos</div>
    </div>
    <canvas id="annualChart"></canvas>
    <div class="table-wrap mt"><table>
      <thead><tr><th>Mes</th><th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Balance</th></tr></thead>
      <tbody>${tbody}</tbody>
      <tfoot><tr style="font-weight:700">
        <td>Total ${esc(year)}</td>
        <td class="num pos">${fmt(tIng)}</td>
        <td class="num neg">${fmt(tEgr)}</td>
        <td class="num ${tIng-tEgr>=0?'pos':'neg'}">${fmt(tIng-tEgr)}</td>
      </tr></tfoot>
    </table></div>`;
  // el canvas necesita estar en el DOM para medir su ancho.
  // Barras agrupadas (Ingresos/Egresos por mes): se ven bien con datos
  // escasos o con el año completo, sin los picos feos del gráfico de líneas.
  setTimeout(()=>{
    const cv=document.getElementById("annualChart");
    if(cv) drawBars(cv,mesNombres,[
      {name:"Ingresos",color:"#16a34a",values:rows.map(r=>r.totalIngresos)},
      {name:"Egresos",color:"#dc2626",values:rows.map(r=>r.totalEgresos)}
    ],{height:280});
  },0);
  return card;
}
const _renderDashboard=renderDashboard;
renderDashboard=function(c){
  _renderDashboard(c);                              // header + dos cards
  c.appendChild(buildAnnualSection(selectedMonth)); // evolución anual (gráfico + cuadro)
  c.appendChild(buildExpandableSummary(selectedMonth)); // detalle del mes, al final
};

  });
